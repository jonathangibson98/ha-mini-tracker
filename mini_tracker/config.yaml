name: "Mini Tracker"
version: "1.1.1"
slug: "mini_tracker"
description: "Lightweight location history map: trails, playback, stops, places, heatmap. Uses your HA people and trackers."
url: "https://github.com/jonathangibson98/ha-mini-tracker"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant: "2025.1.0"

# Admin UI lives in the HA sidebar (ingress). Large file imports need streaming.
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:map-marker-path"
panel_title: "Tracker"
panel_admin: true

# Optional read-only map + ingest API for dashboards and other apps.
# Remove the number in the Network section (or turn it off in the app's Settings) to disable.
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: "Read-only map (and optional ingest API)"

# Locations come from Home Assistant itself through the Supervisor proxy.
homeassistant_api: true

# Read-only view of /homeassistant so your custom SVG icons can be used as custom:name
map:
  - type: homeassistant_config

# Optional MQTT sensors (place, distance today) via the Mosquitto app.
services:
  - mqtt:want

# SQLite in /data: stop the app during backups so the database is consistent.
backup: cold

watchdog: "http://[HOST]:[PORT:8099]/health"

options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
